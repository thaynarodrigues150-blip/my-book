<body>
    <section id="telaLogin" class="tela">

        
        <header class="logo">
            <span class="play">▶</span>
            <span class="telaTexto">Tela</span><span class="x">X</span>
        </header>


        
        <main class="login-container">

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="digite seu email"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="digite sua senha..."
                    required
                >

                <a href="#" class="esqueci">
                    esqueceu sua senha?
                </a>

                <div class="linha"></div>

                <button
                    type="submit"
                    class="entrar-button"
                >
                    ENTRAR
                </button>

                <button
                    type="button"
                    class="google-button"
                    id="googleButton"
                >
                    <span class="google-icon">G</span>

                    <span>entrar com o google</span>
                </button>

            </form>

        </main>

    </section>


    <section id="telaUsuarios" class="tela usuarios-tela">

                <p>nome de usuario</p>

            </div>


            
            <button
                class="adicionar"
                id="adicionarUsuario"

                <span>+</span>
            </button>

        </main>

    </section>


    <script src="script.js"></script>
